name: android_build_debug

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4
      
    - name: Debug - List files
      run: |
        echo "=== 当前目录结构 ==="
        pwd
        ls -la
        echo "=== project-to-build 文件 ==="
        if [ -f project-to-build ]; then
          echo "文件存在，内容:"
          cat project-to-build
        else
          echo "❌ 文件不存在!"
          echo "创建的文件:"
          find . -type f -name "project*" 2>/dev/null || echo "未找到相关文件"
        fi
        
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: |
          platform-tools
          platforms;android-33
          build-tools;33.0.2
        accept-android-sdk-licenses: true
        
    - name: Debug - Check Android SDK
      run: |
        echo "=== 检查 Android SDK ==="
        which adb || echo "adb 未找到"
        which aapt || echo "aapt 未找到"
        
    - name: Get project name
      id: get-project
      run: |
        echo "=== 读取项目URL ==="
        if [ -f project-to-build ]; then
          PROJECT_URL=$(cat project-to-build)
          echo "项目URL: $PROJECT_URL"
          echo "PROJECT=$PROJECT_URL" >> $GITHUB_OUTPUT
        else
          echo "❌ 错误: project-to-build 文件不存在!"
          exit 1
        fi
        
    - name: Clone project
      run: |
        echo "=== 开始克隆项目 ==="
        echo "克隆 URL: ${{ steps.get-project.outputs.PROJECT }}"
        git clone --depth=1 "${{ steps.get-project.outputs.PROJECT }}" project
        
    - name: Debug - Check cloned project
      run: |
        echo "=== 检查克隆的项目 ==="
        ls -la project/
        if [ -f project/gradlew ]; then
          echo "✅ gradlew 文件存在"
        else
          echo "❌ gradlew 文件不存在!"
          echo "项目文件:"
          find project/ -type f -name "*.gradle*" 2>/dev/null | head -10
        fi
        
    - name: Build APK
      working-directory: ./project
      run: |
        echo "=== 开始构建 APK ==="
        chmod +x gradlew
        echo "Gradle 版本:"
        ./gradlew --version
        echo "开始构建..."
        ./gradlew assembleDebug --stacktrace
        
    - name: Verify APK files
      run: |
        echo "=== 验证 APK 文件 ==="
        echo "搜索 APK 文件..."
        find ./project -name "*.apk" -type f 2>/dev/null || echo "未找到 APK 文件"
        echo "项目输出目录:"
        find ./project -type d -name "outputs" 2>/dev/null
        
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: ./project/**/*.apk
