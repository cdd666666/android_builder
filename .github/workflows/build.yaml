name: android_build_direct

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: |
          platform-tools
          platforms;android-33
          build-tools;33.0.2
        accept-android-sdk-licenses: true
        
    - name: Debug - Direct test
      run: |
        echo "=== 直接测试 ==="
        pwd
        ls -la
        
    - name: Direct build (不克隆)
      run: |
        echo "=== 直接构建当前项目 ==="
        if [ -f gradlew ]; then
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        else
          echo "当前目录没有 gradlew 文件"
          find . -name "gradlew" -type f
        fi
