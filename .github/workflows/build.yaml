name: android_build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      # 使用正确的参数名
      with:
        packages: |
          platform-tools
          platforms;android-33
          build-tools;33.0.2
          ndk;25.1.8937393
        accept-android-sdk-licenses: true
        
    - name: Get project name
      id: get-project
      run: echo "PROJECT=$(cat project-to-build)" >> $GITHUB_OUTPUT
      
    - name: Clone project
      run: |
        git clone --depth=1 "${{ steps.get-project.outputs.PROJECT }}" project
        
    - name: Cache Gradle dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          project/.gradle
        key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-
          
    - name: Build APK
      working-directory: ./project
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace
        
    - name: Verify APK files
      run: |
        echo "Generated APK files:"
        find ./project -name "*.apk" -type f
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: ./project/**/*.apk
