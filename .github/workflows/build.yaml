name: android_build_fixed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        
    # 使用 Google 官方推荐的 action
    - name: Setup Android SDK
      uses: android-actions/setup-android-sdk@v2.0.0
      with:
        api-level: 33
        build-tools: 33.0.2
        ndk-version: 25.1.8937393
        
    - name: Get project name
      id: get-project
      run: echo "PROJECT=$(cat project-to-build)" >> $GITHUB_OUTPUT
      
    - name: Clone project
      run: |
        git clone --depth=1 "${{ steps.get-project.outputs.PROJECT }}" project
        
    - name: Build APK
      working-directory: ./project
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: ./project/**/*.apk
        
